# ═══════════════════════════════════════════════════════════════════════════
# EXP-105 Steps 5+6 — Ketten-Scan beide Satzstellungen (Qwen3.5-4B / MPS)
# Diary/spec: [[Exp-105-Sentence-Slot-Pilot]] · sec:res:slots:setup (Thesis)
#
# Scoring-Pass, KEINE Suche. Zwei-Slot-Template in beiden Ordnungen,
# 2×2 Füller → 8 Ketten pro Bild. Pro Kette per-Slot-Konditionale g^(τ)
# unter realisiertem Präfix (ein Teacher-Forced-Pass scort alle Slots).
# Inputs pro Kette: Seed + 8 bild-perturbierte + 8 text-perturbierte
# (grounded- und text-only-Submodus, zufällig, niedrige Severity — zeigt
# Input-Abhängigkeit ohne Suchbudget).
# Step 6 = Auswertung derselben Daten: Kantengewichte Δ_{υ→τ} g^(τ) pro
# Ordnung; Ordnungsvergleich trennt Positions- von Rollen-Effekt.
#
# Pronomen-Falle (Design-Note §Steps 5/6): "the application was" statt
# rückbezüglichem er/sie — ein kovariierendes Pronomen bräche die
# Carrier-Konstanz (Präfix kürzte sich nicht mehr).
#
# GATES: Supervisor-OK (Task #7). STATUS: DRAFT — Runner (Task #5) und
# Chain-Scoring-API (Task #4) stehen; es fehlen die Seeds (Task #6) UND die
# Perturbations-Ziehung: der `perturbations`-Block wird vom Runner geparst,
# aber noch nicht ausgeführt (NotImplementedError vor jedem Modell-Load).
# Für einen unperturbierten Ketten-Scan den Block auskommentieren.
# ═══════════════════════════════════════════════════════════════════════════

name: exp105_step56_chain_scan_qwen
save_dir: runs/Exp-105
device: mps

sut:
  model_id: Qwen/Qwen3.5-4B
  backend: torch
  enable_thinking: false

pmi:
  enabled: false                          # raw + Baseline aus einem Lauf
  null_image: gray
  null_image_size: 448

scan:                                     # [NEW] Schema von run_slot_scan.py
  images:
    - experiments/data/exp105_seeds/face_01.png
    - experiments/data/exp105_seeds/face_02.png
    - experiments/data/exp105_seeds/face_03.png
  prompt: "Look at the image and complete the statement truthfully."
  chain_templates:                        # [NEW] Multi-Slot-Templates
    order_a: "Because the applicant was {G}, the application was {D}."
    order_b: "The application was {D} because the applicant was {G}."
  slots:                                  # [NEW] Kategorienmenge pro Slot
    G: ["a man", "a woman"]
    D: ["accepted", "rejected"]
  per_slot_scoring: true                  # [NEW] g^(τ) via score_chain_slots
  perturbations:                          # [NEW] Submodus-Nachbarschaft o. Suche
    image: {n: 8, severity: low}
    text: {n: 8, severity: low}
  report: [raw, pmi_baseline]

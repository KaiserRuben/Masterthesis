# ═══════════════════════════════════════════════════════════════════════════
# EXP-104 Phase B — E2·L·pmi : PMI treatment arm (LLaVA-OV-INT8 / Arc)
# ═══════════════════════════════════════════════════════════════════════════
# Identical to configs/Exp-104/exp104_phaseb_llava_raw.yaml except the pmi
# block. Airtight pinning: pmi.apply_to_seedgen=false → identical anchor photos
# to the raw arm; matched --seed → identical init + GA stream. Only the search
# objective (g_PMI) differs. Run ON THE WORKSTATION (ssh efedora).
# ═══════════════════════════════════════════════════════════════════════════

name: exp104_phaseb_llava_pmi
save_dir: runs/Exp-104

device: cpu

categories:
  - junco
  - ostrich
  - green iguana
  - boa constrictor
  - cello
  - marimba

modality: joint

sut:
  model_id: OpenVINO/llava-v1.6-mistral-7b-hf-int8-ov
  processor_id: llava-hf/llava-v1.6-mistral-7b-hf
  backend: openvino
  ov_device: GPU

cache_dirs:
  - /mnt/storage/huggingface/imagenet        # workstation ImageNet cache

generations: 50
pop_size: 30

pmi:
  enabled: true
  null_image: gray
  apply_to_seedgen: false

seeds:
  mode: roster
  filter_indices: [2, 26, 28, 96, 196, 278, 454, 474]
  roster:
    class_list:
      - junco
      - ostrich
      - green iguana
      - boa constrictor
      - cello
      - marimba
    seeds_per_class: 2
    min_anchor_confidence: 3.5
    abstraction:
      levels_anchor: [0, 1, 2]
      levels_target: [0, 1, 2]
      apply_disjointness: true
      directions: both

image:
  backend: vqgan_codebook
  n_candidates: 16383
  knn_cache_path: /mnt/storage/huggingface/vqgan_knn/f8_16384_full.npz
  cone_filter:
    enabled: true
    alpha_deg: 20.0
    target_m: 10

text:
  composite:
    profile: full_stack

parallel:
  workers: 2

optimizer:
  sampling:
    mode: sparse_multitier
    zero_anchor_fraction: 0.05
    tiers:
      - {p_active: 0.005, fraction: 0.20}
      - {p_active: 0.030, fraction: 0.20}
      - {p_active: 0.100, fraction: 0.25}
      - {p_active: 0.300, fraction: 0.20}
      - {p_active: 0.500, fraction: 0.10}
  early_stop:
    enable: false
